<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CDP helpers fixture</title>
    <style>
      #a {
        background-color: rgb(255, 255, 255);
      }
      #a:hover {
        background-color: rgb(255, 0, 0);
      }
      #b:focus-visible {
        outline: 3px solid rgb(0, 0, 255);
      }
    </style>
  </head>
  <body>
    <main>
      <button type="button" id="a">Hover me</button>
      <button type="button" id="b">Focus me</button>
    </main>
  </body>
</html>
