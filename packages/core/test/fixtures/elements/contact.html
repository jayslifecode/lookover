<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact fixture</title>
  </head>
  <body>
    <!-- Every attribute a selector could be built on holds an address that redaction rewrites. -->
    <main>
      <a href="mailto:support@example.com">Email support</a>
      <a href="MAILTO:sales@example.com">Email sales</a>
      <a href="tel:+97699112233">Call us</a>
      <button type="button" data-testid="invite-jay@example.com">Invite</button>
      <button type="button" id="profile-jay@example.com">Profile</button>
      <input name="contact@example.com" aria-label="Contact" />
      <button type="button" aria-label="Write to jay@example.com">Write</button>
    </main>
    <section id="team">
      <a href="mailto:team@example.com">Team</a>
    </section>
    <section id="owner@example.com">
      <button type="button">Owner</button>
    </section>
  </body>
</html>
