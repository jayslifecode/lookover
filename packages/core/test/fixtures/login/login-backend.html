<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <form action="/login" method="post">
      <label>Username <input name="user" type="text" /></label>
      <label>Password <input name="pass" type="password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <script>
      // The login page loads its settings from a backend, as hosted auth widgets do.
      fetch('https://config.backend.test/v1/settings').catch(() => undefined);
    </script>
  </body>
</html>
