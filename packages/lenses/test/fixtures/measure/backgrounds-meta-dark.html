<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Chromium paints the canvas dark for this, though the root's computed color-scheme stays normal. -->
    <meta name="color-scheme" content="dark" />
    <title>Backgrounds on a canvas the meta tag darkens</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 sans-serif;
      }
    </style>
  </head>
  <body>
    <p id="bare">Text straight on a dark canvas</p>
  </body>
</html>
