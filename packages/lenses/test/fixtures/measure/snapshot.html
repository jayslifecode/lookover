<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Style snapshot fixture</title>
    <style>
      #styled {
        outline: 2px dashed rgb(255, 0, 0);
        outline-offset: 3px;
        box-shadow: 0 0 0 4px rgb(0, 0, 255);
        border: 1px solid rgb(0, 128, 0);
        background-color: rgb(250, 250, 250);
        color: rgb(17, 24, 39);
        text-decoration: underline rgb(5, 6, 7);
        cursor: pointer;
        opacity: 0.9;
      }
      #styled:hover {
        background-color: rgb(229, 231, 235);
      }
      #styled::before {
        content: '';
        outline: 1px solid rgb(1, 2, 3);
      }
      #styled::after {
        content: '>';
        color: rgb(4, 5, 6);
      }
    </style>
  </head>
  <body>
    <button type="button" id="styled">Styled</button>
  </body>
</html>
