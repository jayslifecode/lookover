<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keyboard trap fixture</title>
  </head>
  <body>
    <button type="button" id="before">Before</button>
    <input id="stuck" aria-label="Stuck" />
    <button type="button" id="after">After</button>
    <script>
      const stuck = document.querySelector('#stuck');
      stuck.addEventListener('keydown', (event) => {
        if (event.key !== 'Tab') return;
        event.preventDefault();
        stuck.focus();
      });
    </script>
  </body>
</html>
