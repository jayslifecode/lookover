<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frame fixture</title>
  </head>
  <body>
    <button type="button" id="before">Before</button>
    <iframe
      id="payment"
      title="Payment"
      width="300"
      height="120"
      srcdoc="<button>One</button><button>Two</button><button>Three</button><button>Four</button>"
    ></iframe>
    <button type="button" id="after">After</button>
  </body>
</html>
