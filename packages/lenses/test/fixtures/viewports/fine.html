<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Viewport fine fixture</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 sans-serif;
      }
    </style>
  </head>
  <body>
    <p>A page that fits every screen: only the table is wider, and it scrolls inside its own wrapper.</p>
    <div id="table-wrap" style="overflow-x: auto">
      <table style="width: 800px">
        <tr>
          <td>A wide table</td>
          <td>that scrolls inside its own wrapper</td>
        </tr>
      </table>
    </div>
  </body>
</html>
