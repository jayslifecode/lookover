name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # pnpm's version comes from "packageManager" in package.json (pnpm 10).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @jayslifecode/lookover-core exec playwright install --with-deps chromium

      # Builds every package, the report included, before its tests.
      - name: Lint, typecheck and unit tests
        run: pnpm check

      # The bench suite, then the report's: its views, its frame budget, and Lookover reviewing it.
      - name: End-to-end tests against the bench app and the report
        run: pnpm test:e2e

      - name: Upload end-to-end logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: packages/cli/.e2e/
          # The directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # The report's measured frames, kept on every run, passing or not, to follow the budget over time.
      - name: Upload the report's frame times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-frames
          path: packages/cli/.e2e/frames.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
